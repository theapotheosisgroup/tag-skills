# Blocking CI for tag-skills. Standards: https://github.com/theapotheosisgroup/.github/blob/main/standards/CI-CD.md
#
# Shared workflows are pinned to the merged commit of theapotheosisgroup/.github main, because .github
# has no release tag yet; move the pins to a release SHA when one exists. Every job blocks: none uses
# continue-on-error.
#
# What runs: format, lint, type check, unit, contract (mocked), finance fixture, selection and script
# tests, then validation, the catalog check and Skills CLI discovery and installation (README
# "Continuous integration"). The reusable node job uses the runner image's Python 3 for skill-script
# tests; python-minimum repeats them on Python 3.10, the minimum the scripts declare. No job uses live
# client credentials or performs a ledger operation. Not in CI: upstream:check (network) and
# installation from the private GitHub repository (needs a credential decision).
name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lockfile install, format, lint, type check, npm test, and test:smoke (validate skills/ and the
  # fixture, check catalog.json, then Skills CLI discovery and installation). No build: nothing is built.
  node:
    name: node
    permissions:
      contents: read
    uses: theapotheosisgroup/.github/.github/workflows/reusable-node-ci.yml@605428cef3906d16913b49a697df33d61722f7d3 # main (no release yet)
    with:
      node-version-file: .nvmrc
      contract-test-script: test:smoke
      build-script: ""

  # Skill scripts declare python3 >= 3.10; prove it on 3.10 itself.
  python-minimum:
    name: python-minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Skill-script and contract tests on Python 3.10
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
          node --test tests/skills/ tests/contracts/

  markdown:
    name: markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            #**/node_modules

  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: every relative link and in-repo anchor must resolve. External URLs are not checked
      # here, so a third-party outage cannot block a merge.
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules './**/*.md'
          fail: true
          format: markdown
          jobSummary: true

  codeowners:
    name: codeowners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Ask GitHub to validate CODEOWNERS at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          errors="$(gh api "repos/$REPO/codeowners/errors?ref=$REF" --jq '.errors')"
          echo "$errors"
          if [[ "$errors" != "[]" ]]; then
            echo "::error::CODEOWNERS has errors (see above)."
            exit 1
          fi

  # gitleaks over the full history; OSV-Scanner vulnerabilities and license policy over package-lock.json.
  # dependency-review stays off: private repository on the Team plan, without GitHub Code Security.
  security:
    name: security
    permissions:
      contents: read
    uses: theapotheosisgroup/.github/.github/workflows/reusable-security.yml@605428cef3906d16913b49a697df33d61722f7d3 # main (no release yet)
    with:
      dependency-review: false
